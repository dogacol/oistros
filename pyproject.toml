[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oistros"
version = "0.1.0"
description = "Oistros — the philosophical gadfly. Reads ancient texts, observes the present, writes philosophical commentary via a local LLM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "schedule>=1.2",
]

[project.scripts]
oistros = "oistros.cli:main"

[tool.setuptools.packages.find]
include = ["oistros*"]

[tool.setuptools.package-data]
oistros = ["data/*.json"]
